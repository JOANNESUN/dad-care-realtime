<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f7f8">
  <!-- Opened from the home screen these drop the browser chrome, so it reads
       as an app rather than a page. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dad Care">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title data-i18n="pageTitle">Dad Care Log</title>
  <style>
    :root {
      --bg:#f6f7f8; --card:#fff; --text:#1f2937; --muted:#6b7280;
      --line:#e5e7eb; --accent:#374151; --soft:#f3f4f6;
      --good:#166534; --good-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:980px; margin:0 auto; padding:24px 16px 48px; }
    .topline { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .status-switch { display:inline-flex; gap:0; border:1px solid var(--line); border-radius:999px;
                     overflow:hidden; background:var(--soft); }
    .status-btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; cursor:pointer;
                  border:0; border-radius:0; background:transparent; color:var(--muted); font-size:14px; }
    .status-btn.active { background:var(--accent); color:#fff; }
    .status-btn:disabled { cursor:default; opacity:1; }

    /* Where he is should be obvious before reading a word. */
    body.at-hospital { background:#e6f2fb; }
    body.at-home { background:#fdf7e3; }
    .wellness-scale { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
    .wellness-chip { display:inline-flex; align-items:center; gap:4px; }
    .topline-right { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .lang-tabs { display:flex; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--soft); }
    .lang-tab { padding:9px 16px; font-size:14px; border:0; border-radius:0; cursor:pointer; background:transparent; color:var(--muted); }
    .lang-tab.active { background:var(--accent); color:#fff; }
    h1 { margin:0 0 4px; font-size:28px; }
    h2 { font-size:18px; margin:20px 0; }
    .subtitle,.meta,.footer-note { color:var(--muted); }
    .subtitle { margin-bottom:22px; }
    .live { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; font-size:14px; background:var(--warn-bg); color:var(--warn); height:fit-content; }
    .live.connected { background:var(--good-bg); color:var(--good); }
    /* He is asleep right now - a state, not an event, so it belongs up here
       beside where he is rather than only in the timeline. */
    /* The one cell in this table that is a length rather than a tally. */
    .counts-table td.slept { font-variant-numeric:tabular-nums; white-space:nowrap; }
    .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
    /* The page tint changes with location, so this banner is separated by its
       border and shadow, not by the fill alone - a pale wash can't carry it. */
    .access-card { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
                   background:#cdeed8; border:1px solid #9ed6b4; border-left:5px solid #15803d;
                   box-shadow:0 1px 3px rgba(20,83,45,.10); }
    .access-card h2 { margin:0; color:#14532d; }
    .access-card .actions { margin-top:0; gap:10px; }
    .access-btn { display:inline-block; text-decoration:none; padding:12px 20px; border-radius:10px;
                  font-size:15px; font-weight:600; background:#15803d; color:#fff; border:1px solid #15803d; }
    .access-btn:hover { background:#166534; border-color:#166534; }
    .access-btn.muted { background:#f9fefb; color:#166534; border-color:#8cc9a5; font-weight:500; }
    .access-btn.muted:hover { background:#fff; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .full { grid-column:1/-1; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input,select,textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
    textarea { min-height:76px; resize:vertical; }
    button { border:0; border-radius:10px; padding:10px 14px; font:inherit; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .primary { background:var(--accent); color:#fff; }
    .secondary { background:var(--soft); color:var(--text); }
    .actions,.view-tabs,.period-controls,.timeline-filters { display:flex; gap:8px; flex-wrap:wrap; }
    .actions { margin-top:14px; }
    .toolbar { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .tab.active,.filter-chip.active { background:var(--accent); color:#fff; }
    .period-controls { align-items:center; }
    .period-label { min-width:180px; text-align:center; font-weight:700; }
    .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
    .summary-box { border:1px solid var(--line); border-radius:12px; padding:12px; }
    .summary-label { color:var(--muted); font-size:14px; margin-bottom:5px; }
    .summary-value { font-size:24px; font-weight:700; }
    .chart-wrap { overflow-x:auto; }
    #tempChart, #wellnessChart { width:100%; min-width:660px; height:auto; display:block; }
    .counts-table { width:100%; border-collapse:collapse; font-size:14px; }
    .counts-table th,.counts-table td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; }
    .counts-table th { color:var(--muted); font-weight:600; }
    .timeline-filters { margin:10px 0 4px; }
    .day-group { margin-top:24px; }
    .day-title { font-size:19px; font-weight:700; padding-bottom:8px; border-bottom:2px solid var(--line); }
    /* One row per entry. The median entry is eight characters long, so a card,
       a rail, a dot and a spelled-out type label all cost more height than the
       words they surround - the icon carries the type instead, and the height
       that buys goes into the type size. */
    .timeline { display:grid; grid-template-columns:auto 28px 1fr; column-gap:12px;
                align-items:baseline; }
    .entry { display:contents; }
    .entry > * { padding:9px 0; border-top:1px solid var(--soft); }
    .entry:first-child > * { border-top:0; }
    /* min-width pins the track to the text: an auto grid column can still be
       squeezed, and a squeezed nowrap time overflows underneath the icon. */
    .time { color:var(--muted); font-size:16px; font-variant-numeric:tabular-nums;
            white-space:nowrap; min-width:max-content; padding-right:2px; }
    .entry-icon { font-size:21px; line-height:1.2; }
    .entry-body { font-size:17px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere;
                  min-width:0; }
    .entry-value { font-weight:700; }
    .entry-bare { color:var(--muted); }
    .meta { font-size:15px; margin-top:7px; }
    .small { padding:6px 9px; font-size:12px; }
    .empty { text-align:center; color:var(--muted); padding:24px 0; }
    /* A note is standing information, not an event, so it stays put at the top
       instead of scrolling away down the timeline with everything else. */
    .note-card { border-left:5px solid #b45309; background:#fffbeb; border-color:#fde68a; }
    /* The same fold control as 重要記事, in the page's neutral palette. */
    .fold-heading { margin:22px 0 12px; }
    .fold-head { display:flex; align-items:center; gap:10px; width:100%; padding:2px 0;
                 background:none; border:0; font:inherit; font-size:18px; font-weight:700;
                 color:var(--text); text-align:left; cursor:pointer; }
    .fold-count { font-weight:500; font-size:15px; color:var(--muted); }
    .fold-action { margin-left:auto; display:inline-flex; align-items:center; gap:8px;
                   border:0; border-radius:999px; padding:10px 20px;
                   background:var(--accent); font-size:17px; font-weight:600; color:#fff;
                   white-space:nowrap; box-shadow:0 1px 2px rgba(31,41,55,.25); }
    .fold-head:hover .fold-action { background:#1f2937; }
    .fold-head:focus-visible { outline:none; }
    .fold-head:focus-visible .fold-action { outline:3px solid var(--accent); outline-offset:3px; }
    .fold-arrow { font-size:13px; transition:transform .15s ease; }
    .fold-head.folded .fold-arrow { transform:rotate(-90deg); }
    @media (prefers-reduced-motion:reduce){ .fold-arrow{transition:none} }

    .note-heading { margin:0; }
    .note-head { display:flex; align-items:center; gap:10px; width:100%; padding:2px 0;
                 background:none; border:0; font:inherit; font-size:19px; font-weight:700;
                 color:#92400e; text-align:left; cursor:pointer; }
    .note-count { font-weight:500; font-size:15px; opacity:.85; }
    /* A word, not a chevron: the control has to be readable at a glance and
       big enough to hit without aiming. */
    .note-action { margin-left:auto; display:inline-flex; align-items:center; gap:8px;
                   border:0; border-radius:999px; padding:10px 20px;
                   background:#b45309; font-size:17px; font-weight:600; color:#fff;
                   white-space:nowrap; box-shadow:0 1px 2px rgba(146,64,14,.3); }
    .note-head:hover .note-action { background:#92400e; }
    .note-head:focus-visible { outline:none; }
    .note-head:focus-visible .note-action { outline:3px solid #92400e; outline-offset:3px; }
    .note-arrow { font-size:13px; transition:transform .15s ease; }
    .note-card.collapsed .note-arrow { transform:rotate(-90deg); }
    .note-card.collapsed .note-body { display:none; }
    .note-body { margin-top:12px; }
    .note { padding:10px 0; border-top:1px solid #fde68a; }
    .note:first-child { border-top:0; padding-top:0; }
    .note-when { font-size:14px; color:#92400e; margin-bottom:3px; }
    .note-text { font-size:17px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
    /* A long note is clamped rather than pushing the page down; tapping it
       opens the rest. */
    .note-text.clamped { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
                         overflow:hidden; }
    .note-more { margin-top:8px; display:inline-flex; align-items:center; gap:7px;
                 border:2px solid #b45309; border-radius:999px; padding:8px 16px;
                 background:#fff; font:inherit; font-size:16px; font-weight:600;
                 color:#92400e; cursor:pointer; }
    .note-more:hover { background:#fef3c7; }
    .note-more:focus-visible { outline:2px solid #92400e; outline-offset:2px; }
    .note-toggle { margin-top:14px; }
    @media (prefers-reduced-motion:reduce){ .note-arrow{transition:none} }
    .error { color:#991b1b; margin-top:10px; font-size:13px; }
    .footer-note { font-size:12px; line-height:1.5; margin-top:14px; }
    @media(max-width:720px){
      .grid{grid-template-columns:1fr}.full{grid-column:auto}
      .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .period-label{min-width:130px;text-align:left}
      .timeline{grid-template-columns:auto 24px 1fr;column-gap:9px}
    }
  </style>
</head>
<body>
<div class="container">
  <div class="topline">
    <div>
      <h1 data-i18n="appTitle"></h1>
    </div>
    <div class="topline-right">
      <div id="statusSwitch" class="status-switch" role="group" aria-label="Location"></div>
      <div class="lang-tabs" role="group" aria-label="Language">
        <button type="button" class="secondary lang-tab" data-lang="en" onclick="I18N.setLang('en')">EN</button>
        <button type="button" class="secondary lang-tab" data-lang="zh" onclick="I18N.setLang('zh')">中文</button>
      </div>
      <div id="liveStatus" class="live"><span class="dot"></span><span id="liveText">Connecting…</span></div>
    </div>
  </div>

  <div class="card access-card">
    <h2 data-i18n="familyAccess"></h2>
    <div class="actions">
      <a href="/editor" id="editorLink" class="access-btn" style="display:none;" data-i18n="addDeleteRecords"></a>
      <a href="/logout" class="access-btn muted" data-i18n="signOut"></a>
    </div>
  </div>

  <div class="card note-card" id="noteCard" style="display:none">
    <h2 class="note-heading">
      <button type="button" class="note-head" id="noteHead" onclick="toggleNoteCard()"
              aria-expanded="true" aria-controls="noteBody">
        <span data-i18n="notesTitle"></span>
        <span class="note-count" id="noteCount"></span>
        <span class="note-action"><span id="noteActionText"></span><span class="note-arrow" aria-hidden="true">▾</span></span>
      </button>
    </h2>
    <div class="note-body" id="noteBody">
      <div id="noteList"></div>
      <button type="button" class="note-more note-toggle" id="noteToggle" style="display:none" onclick="toggleNotes()"></button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="view-tabs">
        <button id="todayTab" class="secondary tab active" onclick="setView('today')" data-i18n="today"></button>
        <button id="weekTab" class="secondary tab" onclick="setView('week')" data-i18n="week"></button>
        <button id="monthTab" class="secondary tab" onclick="setView('month')" data-i18n="month"></button>
      </div>
      <div class="period-controls">
        <button class="secondary" onclick="movePeriod(-1)">‹</button>
        <div id="periodLabel" class="period-label"></div>
        <button class="secondary" onclick="movePeriod(1)">›</button>
        <button class="secondary" onclick="goToday()" data-i18n="today"></button>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-box"><div class="summary-label" data-i18n="sumFood"></div><div id="foodCount" class="summary-value">0</div></div>
      <div class="summary-box"><div class="summary-label" data-i18n="sumMedicine"></div><div id="medicineCount" class="summary-value">0</div></div>
      <div class="summary-box"><div class="summary-label" data-i18n="sumIv"></div><div id="ivCount" class="summary-value">0</div></div>
      <div class="summary-box"><div class="summary-label" data-i18n="sumTemp"></div><div id="tempCount" class="summary-value">0</div></div>
    </div>

    <h2 data-i18n="temperatureTrend"></h2>
    <div id="chartContainer" class="chart-wrap"><svg id="tempChart" viewBox="0 0 900 260"></svg></div>
    <div id="chartEmpty" class="empty" style="display:none" data-i18n="noTemperature"></div>

    <h2 style="margin-top:18px" data-i18n="wellnessTrend"></h2>
    <div id="wellnessWrap" class="chart-wrap"><svg id="wellnessChart" viewBox="0 0 900 200"></svg></div>
    <div id="wellnessEmpty" class="empty" style="display:none" data-i18n="noWellness"></div>

    <h2 class="fold-heading">
      <button type="button" class="fold-head" id="countsHead" onclick="toggleCounts()"
              aria-expanded="true" aria-controls="countsBody">
        <span data-i18n="dailyActivity"></span>
        <span class="fold-count" id="countsCount"></span>
        <span class="fold-action"><span id="countsActionText"></span><span class="fold-arrow" aria-hidden="true">▾</span></span>
      </button>
    </h2>
    <div id="countsBody"><div id="countsTableWrap"></div></div>
  </div>

  <div class="card">
    <div class="event-top">
      <div>
        <div class="event-type" data-i18n="timeline"></div>
        <div class="meta" data-i18n="timelineDesc"></div>
      </div>
    </div>

    <div class="timeline-filters">
      <button class="secondary filter-chip active" data-filter="All" onclick="setTimelineFilter('All')" data-i18n="filterAll"></button>
      <button class="secondary filter-chip" data-filter="Food / Drink" onclick="setTimelineFilter('Food / Drink')" data-i18n="filterFood"></button>
      <button class="secondary filter-chip" data-filter="Medicine" onclick="setTimelineFilter('Medicine')" data-i18n="filterMedicine"></button>
      <button class="secondary filter-chip" data-filter="IV / Treatment" onclick="setTimelineFilter('IV / Treatment')" data-i18n="filterIv"></button>
      <button class="secondary filter-chip" data-filter="Temperature" onclick="setTimelineFilter('Temperature')" data-i18n="filterTemperature"></button>
    </div>

    <div id="timeline"></div>

    <div class="actions">
      <button class="secondary" onclick="exportCSV()" data-i18n="exportCsv"></button>
    </div>

    <div class="footer-note" data-i18n="footerNote"></div>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
let records = [];
let currentView = "today";
let anchorDate = new Date();
let timelineFilter = "All";
let ws = null;
let reconnectTimer = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const toDateString = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseLocalDate = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const endOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };

const SLEEP_TYPE="Sleep / Rest";

// Wellness and Location already say what they are through their own face or
// pin, so they use that instead of the generic type icon.
function entryIcon(record){
  if(record.type==="Wellness") return I18N.wellnessEmoji(record.amount);
  if(record.type==="Location") return I18N.locationEmoji(record.amount);
  return I18N.typeEmoji(record.type);
}

// Amount and detail were two boxes nobody could tell apart - half the food
// entries used one, half used the other. On the way out they are simply one
// line, and records that filled both still read correctly.
function entryBody(record){
  const strong = text => `<span class="entry-value">${escapeHtml(text)}</span>`;
  const parts = [];

  if(record.type==="Wellness") parts.push(strong(I18N.wellnessLabel(record.amount)));
  else if(record.type==="Location") parts.push(strong(I18N.locationLabel(record.amount)));
  else if(record.amount) parts.push(strong(record.amount));

  const words=[record.detail,record.notes].filter(Boolean).join("\n");
  if(words) parts.push(escapeHtml(words));

  return parts.join(" · ")
      || `<span class="entry-bare">${escapeHtml(I18N.typeLabel(record.type))}</span>`;
}

function sleepMinutesOf(amount){
  const parts=/^(?:(\d{1,3})h)?(?:\s*(\d{1,2})m)?$/.exec(amount||"");
  if(!parts||(!parts[1]&&!parts[2])) return null;
  return Number(parts[1]||0)*60+Number(parts[2]||0);
}

function formatSleepTotal(minutes){
  if(!minutes) return "—";
  const hours=Math.floor(minutes/60), rest=minutes%60;
  if(!hours) return `${rest}m`;
  return rest?`${hours}h ${rest}m`:`${hours}h`;
}

function escapeHtml(value){
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function fillCurrentTime(){
  const now=new Date();
  $("date").value=toDateString(now);
  $("time").value=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function updatePlaceholder(){
  const p={
    "Food / Drink":["e.g. Ate 4 dumplings and tofu drink","e.g. half bowl, 200 mL"],
    "Medicine":["e.g. Took antibiotic and stomach medicine","e.g. 1 tablet"],
    "IV / Treatment":["e.g. IV fluids started","e.g. 500 mL"],
    "Temperature":["e.g. Fever has subsided","e.g. 37.2°C"],
    "Sleep / Rest":["e.g. Started afternoon nap","e.g. slept 1 hour"],
    "Symptoms":["e.g. Mild nausea, no vomiting","e.g. mild / moderate"],
    "Other":["e.g. Doctor visit or general observation","optional"]
  };
  $("detail").placeholder=p[$("type").value][0];
  $("amount").placeholder=p[$("type").value][1];
}

async function loadRecords(){
  const res=await fetch("/api/records");
  if(!res.ok) throw new Error(I18N.t("errLoad"));
  records=await res.json();
  renderAll();
}

async function addEntry(){
  $("formError").textContent="";
  const payload={
    date:$("date").value,
    time:$("time").value,
    type:$("type").value,
    amount:$("amount").value.trim(),
    detail:$("detail").value.trim(),
    notes:$("notes").value.trim()
  };

  $("saveBtn").disabled=true;

  try{
    const res=await fetch("/api/records",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data=await res.json();
    if(!res.ok) throw new Error(data.error || I18N.t("errSave"));

    upsertRecord(data);
    $("amount").value="";
    $("detail").value="";
    $("notes").value="";
    fillCurrentTime();
    renderAll();
  }catch(err){
    $("formError").textContent=err.message;
  }finally{
    $("saveBtn").disabled=false;
  }
}

async function removeEntry(id){
  if(!confirm(I18N.t("confirmDelete"))) return;

  const res=await fetch(`/api/records/${encodeURIComponent(id)}`,{method:"DELETE"});

  if(!res.ok){
    alert(I18N.t("errDelete"));
    return;
  }

  records=records.filter(r=>r.id!==id);
  renderAll();
}

function upsertRecord(record){
  const index=records.findIndex(r=>r.id===record.id);
  if(index>=0) records[index]=record;
  else records.push(record);
}

function connectLive(){
  clearTimeout(reconnectTimer);

  const protocol=location.protocol==="https:" ? "wss:" : "ws:";
  ws=new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen=()=>{
    $("liveStatus").classList.add("connected");
    $("liveText").textContent=I18N.t("live");
  };

  ws.onmessage=e=>{
    if(e.data==="pong") return;

    try{
      const msg=JSON.parse(e.data);

      if(msg.event==="record_added"){
        upsertRecord(msg.record);
        renderAll();
      }

      if(msg.event==="record_deleted"){
        records=records.filter(r=>r.id!==msg.id);
        renderAll();
      }
    }catch{}
  };

  ws.onclose=()=>{
    $("liveStatus").classList.remove("connected");
    $("liveText").textContent=I18N.t("reconnecting");
    reconnectTimer=setTimeout(connectLive,1500);
  };

  ws.onerror=()=>ws.close();
}

function setView(view){
  currentView=view;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  $(`${view}Tab`).classList.add("active");
  renderAll();
}

function setTimelineFilter(filter){
  timelineFilter=filter;
  document.querySelectorAll(".filter-chip").forEach(b=>{
    b.classList.toggle("active",b.dataset.filter===filter);
  });
  renderTimeline();
}

function goToday(){
  anchorDate=new Date();
  renderAll();
}

function movePeriod(direction){
  const d=new Date(anchorDate);

  if(currentView==="today") d.setDate(d.getDate()+direction);
  else if(currentView==="week") d.setDate(d.getDate()+direction*7);
  else d.setMonth(d.getMonth()+direction);

  anchorDate=d;
  renderAll();
}

function getPeriodRange(){
  const d=startOfDay(anchorDate);

  if(currentView==="today"){
    return {start:d,end:endOfDay(d)};
  }

  if(currentView==="week"){
    const day=d.getDay();
    const mondayOffset=day===0 ? -6 : 1-day;
    const start=addDays(d,mondayOffset);
    return {start,end:endOfDay(addDays(start,6))};
  }

  return {
    start:new Date(d.getFullYear(),d.getMonth(),1),
    end:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999)
  };
}

function getPeriodEntries(){
  const {start,end}=getPeriodRange();

  return records.filter(r=>{
    const dt=new Date(`${r.date}T${r.time||"00:00"}`);
    return dt>=start && dt<=end;
  });
}

function formatPeriodLabel(){
  const {start,end}=getPeriodRange();

  if(currentView==="today"){
    return start.toLocaleDateString(I18N.locale(),{
      weekday:"short",day:"numeric",month:"short",year:"numeric"
    });
  }

  if(currentView==="week"){
    return `${start.toLocaleDateString(I18N.locale(),{day:"numeric",month:"short"})} – ${end.toLocaleDateString(I18N.locale(),{day:"numeric",month:"short",year:"numeric"})}`;
  }

  return start.toLocaleDateString(I18N.locale(),{month:"long",year:"numeric"});
}

function renderSummary(){
  const entries=getPeriodEntries();
  const count=type=>entries.filter(e=>e.type===type).length;

  $("foodCount").textContent=count("Food / Drink");
  $("medicineCount").textContent=count("Medicine");
  $("ivCount").textContent=count("IV / Treatment");
  $("tempCount").textContent=count("Temperature");
}

function extractTemperature(entry){
  const match=`${entry.amount||""} ${entry.detail||""}`.match(/(\d{2}(?:\.\d+)?)\s*°?\s*c?/i);
  if(!match) return null;

  const value=Number(match[1]);
  return value>=30 && value<=45 ? value : null;
}

function renderTemperatureChart(){
  const points=getPeriodEntries()
    .filter(e=>e.type==="Temperature")
    .map(e=>({value:extractTemperature(e),date:e.date,time:e.time}))
    .filter(p=>p.value!==null)
    .sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));

  if(!points.length){
    $("tempChart").innerHTML="";
    $("chartContainer").style.display="none";
    $("chartEmpty").style.display="block";
    return;
  }

  $("chartContainer").style.display="block";
  $("chartEmpty").style.display="none";

  const W=900,H=260,L=55,R=20,T=20,B=48,CW=W-L-R,CH=H-T-B;
  const values=points.map(p=>p.value);

  let min=Math.min(36,Math.floor((Math.min(...values)-0.5)*2)/2);
  let max=Math.max(39,Math.ceil((Math.max(...values)+0.5)*2)/2);

  if(max-min<1.5) max=min+1.5;

  const x=i=>points.length===1 ? L+CW/2 : L+(i/(points.length-1))*CW;
  const y=value=>T+((max-value)/(max-min))*CH;
  const output=[];

  for(let i=0;i<=5;i++){
    const value=max-(i/5)*(max-min);
    const yy=T+(i/5)*CH;
    output.push(`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e5e7eb"/>`);
    output.push(`<text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="14" fill="#6b7280">${value.toFixed(1)}°</text>`);
  }

  if(38>=min && 38<=max){
    const feverY=y(38);
    output.push(`<line x1="${L}" y1="${feverY}" x2="${W-R}" y2="${feverY}" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>`);
    output.push(`<text x="${W-R}" y="${feverY-6}" text-anchor="end" font-size="13" fill="#6b7280">38°C</text>`);
  }

  output.push(`<polyline points="${points.map((p,i)=>`${x(i)},${y(p.value)}`).join(" ")}" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`);

  points.forEach((p,i)=>{
    output.push(`<circle cx="${x(i)}" cy="${y(p.value)}" r="5" fill="#374151"><title>${p.date} ${p.time} — ${p.value.toFixed(1)}°C</title></circle>`);
  });

  const step=Math.max(1,Math.ceil(points.length/7));

  points.forEach((p,i)=>{
    if(i%step!==0 && i!==points.length-1) return;

    const label=currentView==="today"
      ? I18N.displayTimeShort(p.time)
      : parseLocalDate(p.date).toLocaleDateString(I18N.locale(),{month:"short",day:"numeric"});

    output.push(`<text x="${x(i)}" y="${H-18}" text-anchor="middle" font-size="14" fill="#6b7280">${escapeHtml(label)}</text>`);
  });

  $("tempChart").innerHTML=output.join("");
}


function currentLocation(){
  const key=r=>`${r.date} ${r.time} ${r.createdAt || ""}`;
  const locations=records
    .filter(r=>r.type==="Location")
    .sort((a,b)=>key(b).localeCompare(key(a)));
  return locations[0] || null;
}

function renderStatusBanner(){
  const latest=currentLocation();
  const place=latest ? latest.amount : null;

  document.body.classList.toggle("at-hospital", place==="Hospital");
  document.body.classList.toggle("at-home", place==="Home");

  // Editors switch it here; viewers just see which one is current.
  $("statusSwitch").innerHTML=["Home","Hospital"].map(v=>`
    <button type="button" class="status-btn${v===place?" active":""}" aria-pressed="${v===place}"
            ${myRole==="editor" ? `onclick="setLocation('${v}')"` : "disabled"}>
      <span>${I18N.locationEmoji(v)}</span><span>${escapeHtml(I18N.locationLabel(v))}</span>
    </button>`).join("");
}

async function setLocation(place){
  const latest=currentLocation();
  if(latest && latest.amount===place) return;

  const now=new Date();
  const payload={
    date:toDateString(now),
    time:`${pad(now.getHours())}:${pad(now.getMinutes())}`,
    type:"Location",
    amount:place,
    detail:"",
    notes:""
  };

  // Show the new place straight away; renderAll() below confirms it from the server.
  $("statusSwitch").querySelectorAll("button").forEach((b,i)=>{
    b.disabled=true;
    const isTarget = ["Home","Hospital"][i]===place;
    b.classList.toggle("active", isTarget);
    b.setAttribute("aria-pressed", String(isTarget));
  });

  try{
    const res=await fetch("/api/records",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(payload)
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error || I18N.t("errSave"));
    upsertRecord(data);
    renderAll();
  }catch(err){
    alert(err.message);
    renderStatusBanner();
  }
}

function renderWellnessChart(){
  const points=getPeriodEntries()
    .filter(e=>e.type==="Wellness")
    .map(e=>({value:Number(e.amount),date:e.date,time:e.time,detail:e.detail}))
    .filter(p=>p.value>=1 && p.value<=5)
    .sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));

  if(!points.length){
    $("wellnessChart").innerHTML="";
    $("wellnessWrap").style.display="none";
    $("wellnessEmpty").style.display="block";
    return;
  }

  $("wellnessWrap").style.display="block";
  $("wellnessEmpty").style.display="none";

  const W=900,H=200,L=55,R=20,T=16,B=40,CW=W-L-R,CH=H-T-B;
  const x=i=>points.length===1 ? L+CW/2 : L+(i/(points.length-1))*CW;
  const y=v=>T+((5-v)/4)*CH;
  const out=[];

  for(let v=5;v>=1;v--){
    const yy=y(v);
    out.push(`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e5e7eb"/>`);
    out.push(`<text x="${L-10}" y="${yy+7}" text-anchor="end" font-size="21">${I18N.wellnessEmoji(v)}</text>`);
  }

  out.push(`<polyline points="${points.map((p,i)=>`${x(i)},${y(p.value)}`).join(" ")}" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`);

  points.forEach((p,i)=>{
    const tip=`${p.date} ${p.time} — ${I18N.wellnessLabel(p.value)}${p.detail?" · "+p.detail:""}`;
    out.push(`<circle cx="${x(i)}" cy="${y(p.value)}" r="5" fill="#374151"><title>${escapeHtml(tip)}</title></circle>`);
  });

  const step=Math.max(1,Math.ceil(points.length/7));
  points.forEach((p,i)=>{
    if(i%step!==0 && i!==points.length-1) return;
    const label=currentView==="today"
      ? I18N.displayTimeShort(p.time)
      : parseLocalDate(p.date).toLocaleDateString(I18N.locale(),{month:"short",day:"numeric"});
    out.push(`<text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="14" fill="#6b7280">${escapeHtml(label)}</text>`);
  });

  $("wellnessChart").innerHTML=out.join("");
}

function buildDailyCounts(){
  const {start,end}=getPeriodRange();
  const entries=getPeriodEntries();
  const rows=[];

  for(let d=startOfDay(start);d<=end;d=addDays(d,1)){
    const date=toDateString(d);
    const dayEntries=entries.filter(e=>e.date===date);

    rows.push({
      date,
      food:dayEntries.filter(e=>e.type==="Food / Drink").length,
      medicine:dayEntries.filter(e=>e.type==="Medicine").length,
      iv:dayEntries.filter(e=>e.type==="IV / Treatment").length,
      temp:dayEntries.filter(e=>e.type==="Temperature").length,
      // Counted against the day he fell asleep, so a night that runs past
      // midnight stays as one figure instead of splitting across two rows.
      sleep:dayEntries.filter(e=>e.type===SLEEP_TYPE)
                      .reduce((total,e)=>total+(sleepMinutesOf(e.amount)||0),0)
    });
  }

  return rows;
}

function renderCountsTable(){
  let rows=buildDailyCounts();
  renderCountsFold(rows.filter(r=>r.food||r.medicine||r.iv||r.temp||r.sleep).length);

  if(currentView==="month"){
    rows=rows.filter(r=>r.food||r.medicine||r.iv||r.temp||r.sleep);
  }

  if(!rows.length){
    $("countsTableWrap").innerHTML=`<div class="empty">${escapeHtml(I18N.t("noActivity"))}</div>`;
    return;
  }

  $("countsTableWrap").innerHTML=`
    <div style="overflow-x:auto">
      <table class="counts-table">
        <thead>
          <tr><th>${escapeHtml(I18N.t("thDate"))}</th><th>${escapeHtml(I18N.t("thFood"))}</th><th>${escapeHtml(I18N.t("thMedicine"))}</th><th>${escapeHtml(I18N.t("thIv"))}</th><th>${escapeHtml(I18N.t("thTemp"))}</th><th>${escapeHtml(I18N.t("thSleep"))}</th></tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${escapeHtml(parseLocalDate(r.date).toLocaleDateString(I18N.locale(),{month:"short",day:"numeric"}))}</td>
              <td>${r.food}</td>
              <td>${r.medicine}</td>
              <td>${r.iv}</td>
              <td>${r.temp}</td>
              <td class="slept">${escapeHtml(formatSleepTotal(r.sleep))}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>`;
}

function formatDate(dateString){
  return parseLocalDate(dateString).toLocaleDateString(I18N.locale(),{
    weekday:"long",year:"numeric",month:"long",day:"numeric"
  });
}

function renderTimeline(){
  // Notes live in their own card at the top, so they are in one place only.
  let entries=getPeriodEntries().filter(e=>e.type!=="Note");

  if(timelineFilter!=="All"){
    entries=entries.filter(e=>e.type===timelineFilter);
  }

  entries.sort((a,b)=>`${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));

  if(!entries.length){
    $("timeline").innerHTML=`<div class="empty">${escapeHtml(I18N.t("noRecords"))}</div>`;
    return;
  }

  const grouped={};

  entries.forEach(entry=>{
    if(!grouped[entry.date]) grouped[entry.date]=[];
    grouped[entry.date].push(entry);
  });

  $("timeline").innerHTML=Object.keys(grouped).sort().reverse().map(date=>`
    <div class="day-group">
      <div class="day-title">${escapeHtml(formatDate(date))}</div>
      <div class="timeline">
        ${grouped[date].map(record=>`
          <div class="entry">
            <div class="time">${escapeHtml(I18N.displayTime(record.time))}</div>
            <div class="entry-icon" role="img" aria-label="${escapeHtml(I18N.typeLabel(record.type))}">${entryIcon(record)}</div>
            <div class="entry-body">${entryBody(record)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

const COUNTS_KEY="dcl_counts_open";
let countsOpen=(()=>{ try{ return localStorage.getItem(COUNTS_KEY)!=="0"; }catch{ return true; } })();

function toggleCounts(){
  countsOpen=!countsOpen;
  try{ localStorage.setItem(COUNTS_KEY, countsOpen?"1":"0"); }catch{}
  renderCountsFold();
}

function renderCountsFold(days){
  $("countsBody").hidden=!countsOpen;
  $("countsHead").classList.toggle("folded", !countsOpen);
  $("countsHead").setAttribute("aria-expanded", String(countsOpen));
  $("countsActionText").textContent=I18N.t(countsOpen?"foldClose":"foldOpen");
  if(days!==undefined) $("countsCount").textContent=days||"";
}

let notesExpanded=false;
const NOTES_SHOWN=3;
const NOTE_LONG=150;
const openNotes=new Set();

// The card remembers whether it was open, because whoever collapsed it meant
// it. Storage can be unavailable, and an unreadable preference is not an error.
const NOTE_CARD_KEY="dcl_notes_open";
let noteCardOpen=(()=>{ try{ return localStorage.getItem(NOTE_CARD_KEY)!=="0"; }catch{ return true; } })();

function toggleNoteCard(){
  noteCardOpen=!noteCardOpen;
  try{ localStorage.setItem(NOTE_CARD_KEY, noteCardOpen?"1":"0"); }catch{}
  renderNotes();
}

function toggleNote(id){
  if(openNotes.has(id)) openNotes.delete(id); else openNotes.add(id);
  renderNotes();
}

// Deliberately reads `records`, not the period: a note from last week still
// matters while you are looking at today.
function allNotes(){
  const key=r=>`${r.date} ${r.time} ${r.createdAt || ""}`;
  return records.filter(r=>r.type==="Note").sort((a,b)=>key(b).localeCompare(key(a)));
}

function toggleNotes(){
  notesExpanded=!notesExpanded;
  renderNotes();
}

function renderNotes(){
  const notes=allNotes();
  $("noteCard").style.display=notes.length?"":"none";
  if(!notes.length) return;

  $("noteCard").classList.toggle("collapsed", !noteCardOpen);
  $("noteHead").setAttribute("aria-expanded", String(noteCardOpen));
  $("noteCount").textContent=notes.length;
  $("noteActionText").textContent=I18N.t(noteCardOpen?"foldClose":"foldOpen");
  if(!noteCardOpen) return;

  const shown=notesExpanded?notes:notes.slice(0,NOTES_SHOWN);

  $("noteList").innerHTML=shown.map(note=>{
    const text=[note.detail,note.amount,note.notes].filter(Boolean).join("\n");
    const long=text.length>NOTE_LONG || text.split("\n").length>4;
    const open=openNotes.has(note.id);
    return `
    <div class="note">
      <div class="note-when">${escapeHtml(formatDate(note.date))}${escapeHtml(I18N.t("atTime"))}${escapeHtml(I18N.displayTime(note.time))}</div>
      <div class="note-text${long && !open ? " clamped" : ""}">${escapeHtml(text)}</div>
      ${long?`<button type="button" class="note-more" onclick="toggleNote('${note.id}')">${escapeHtml(I18N.t(open?"noteReadLess":"noteReadAll"))}<span aria-hidden="true">${open?"▴":"▾"}</span></button>`:""}
    </div>`;
  }).join("");

  const extra=notes.length-NOTES_SHOWN;
  $("noteToggle").style.display=extra>0?"":"none";
  $("noteToggle").textContent=notesExpanded
    ? I18N.t("notesFewer")
    : `${I18N.t("notesMore")} (${extra})`;
}

function renderAll(){
  $("periodLabel").textContent=formatPeriodLabel();
  renderStatusBanner();
  renderNotes();
  renderSummary();
  renderTemperatureChart();
  renderWellnessChart();
  renderCountsTable();
  renderTimeline();
}

function csvEscape(value){
  return `"${String(value??"").replaceAll('"','""')}"`;
}

function exportCSV(){
  if(!records.length){
    alert(I18N.t("nothingToExport"));
    return;
  }

  const headers=I18N.t("csvHeaders");
  const rows=[...records]
    .sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`))
    .map(r=>[r.date,r.time,r.type,r.amount,r.detail,r.notes,r.createdAt]);

  const csv=[headers,...rows].map(row=>row.map(csvEscape).join(",")).join("\n");
  // Excel and Numbers read a CSV as Latin-1 unless it opens with a byte order
  // mark, which is what turned every Chinese character into mojibake.
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="dad-care-log.csv";
  a.click();

  URL.revokeObjectURL(url);
}

let myRole="viewer";

async function loadRole(){
  try{
    const res=await fetch("/api/me");
    if(res.ok) myRole=(await res.json()).role || "viewer";
  }catch{}
  applyRole();
}

function applyRole(){
  $("editorLink").style.display = myRole==="editor" ? "inline-block" : "none";
  renderStatusBanner();
}

window.onLanguageChange=()=>{ applyRole(); renderAll(); };
I18N.applyStatic();

renderAll();

loadRecords().catch(err=>{
  $("timeline").innerHTML=`<div class="empty">${escapeHtml(err.message)}</div>`;
});

loadRole();

connectLive();

setInterval(()=>{
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send("ping");

},30000);
